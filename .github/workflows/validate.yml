name: Validate

permissions: {}

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  validate:
    name: Validate
    uses: grafana/xk6/.github/workflows/extension-validate.yml@971105042f8d3aaedd9a6b3e6b46561f92910eb3 # v1.4.15
    permissions:
      pages: write
      id-token: write
      contents: read
    with:
      go-version: "1.27.3"
      go-versions: '["1.26.10","1.27.3"]'
      golangci-lint-version: "v2.15.0"
      platforms: '["ubuntu-latest", "windows-latest", "macos-latest"]'
      k6-versions: '["v1.3.0", "v1.0.0"]'
      xk6-version: "1.4.14"
      xk6-test-pattern: "test/generate-groups.test.js"
