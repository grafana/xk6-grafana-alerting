name: Release

permissions: {}

on:
  push:
    tags: ["v*.*.*"]

jobs:
  release:
    name: Release
    uses: grafana/xk6/.github/workflows/extension-release.yml@971105042f8d3aaedd9a6b3e6b46561f92910eb3 # v1.4.15
    permissions:
      contents: write
    with:
      go-version: "1.27.3"
      os: '["linux", "windows", "darwin"]'
      arch: '["amd64", "arm64"]'
      k6-version: "v1.3.0"
      xk6-version: "1.2.6"
