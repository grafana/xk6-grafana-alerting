name: Release

permissions: {}

on:
  push:
    tags: ["v*.*.*"]

jobs:
  release:
    name: Release
    uses: grafana/xk6/.github/workflows/extension-release.yml@f107f201f24c0bea350528ac4064a8f87597ed3e # v1.5.0
    permissions:
      contents: write
    with:
      go-version: "1.27.4"
      os: '["linux", "windows", "darwin"]'
      arch: '["amd64", "arm64"]'
      k6-version: "v1.3.0"
      xk6-version: "1.5.0"
