name: Release

permissions: {}

on:
  push:
    tags: ["v*.*.*"]

jobs:
  release:
    name: Release
    uses: grafana/xk6/.github/workflows/extension-release.yml@1b1399b813bff674280427ddf64311c652f32888 # v1.5.1
    permissions:
      contents: write
    with:
      go-version: "1.27.4"
      os: '["linux", "windows", "darwin"]'
      arch: '["amd64", "arm64"]'
      k6-version: "v1.3.0"
      xk6-version: "1.5.0"
